name: Deploy Worker

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.run_number != 1 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps (worker)
        run: bun install --cwd packages/worker --backend=copyfile

      - name: Install deps (web)
        run: bun install --cwd apps/web --backend=copyfile

      - name: Typecheck (worker)
        run: bun --cwd packages/worker typecheck

      - name: Sync secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET_CURRENT: ${{ secrets.JWT_SECRET_CURRENT }}
          JWT_SECRET_PREVIOUS: ${{ secrets.JWT_SECRET_PREVIOUS }}
        run: |
          printf "%s" "$JWT_SECRET_CURRENT" | bunx wrangler secret put JWT_SECRET_CURRENT --cwd .
          if [ -n "$JWT_SECRET_PREVIOUS" ]; then
            printf "%s" "$JWT_SECRET_PREVIOUS" | bunx wrangler secret put JWT_SECRET_PREVIOUS --cwd .
          fi

      - name: Ensure resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! bunx wrangler r2 bucket create bing-mail --cwd .; then
            echo "R2 bucket may already exist, continuing..."
          fi

          if ! bunx wrangler queues create bingmail-parse --cwd .; then
            echo "Queue may already exist, continuing..."
          fi

          D1_LIST_JSON="$(bunx wrangler d1 list --json --cwd .)" || {
            echo "Failed to list D1 databases. Check CLOUDFLARE_API_TOKEN permissions (needs D1)."
            exit 1
          }
          D1_ID="$(printf "%s" "$D1_LIST_JSON" | python3 -c "import json,sys; dbs=json.load(sys.stdin); d=next((x for x in dbs if x.get('name')=='bingmail'), None); keys=('uuid','id','database_id'); print(next((d.get(k) for k in keys if d and isinstance(d.get(k), str) and d.get(k)), ''), end='')")"
          if [ -z "$D1_ID" ]; then
            OUT="$(bunx wrangler d1 create bingmail --cwd .)" || {
              echo "Failed to create D1 database. Check CLOUDFLARE_API_TOKEN permissions (needs D1)."
              exit 1
            }
            D1_ID="$(printf "%s" "$OUT" | python3 -c "import re,sys; m=re.search(r'database_id\\s*=\\s*\"([0-9a-f\\-]{36})\"', sys.stdin.read()); print(m.group(1) if m else '', end='')")"
          fi
          if [ -z "$D1_ID" ]; then
            echo "Failed to resolve D1 database id for 'bingmail'" >&2
            exit 1
          fi
          echo "Resolved D1_ID=$D1_ID"
          if ! printf "%s" "$D1_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "Resolved D1_ID is not a valid UUID: $D1_ID" >&2
            exit 1
          fi

          D1_ID="$D1_ID" python3 - <<'PY'
          import os
          import pathlib
          import re

          d1_id = os.environ.get("D1_ID", "")
          if not d1_id:
            raise SystemExit("Missing D1_ID")
          p = pathlib.Path("wrangler.toml")
          text = p.read_text(encoding="utf-8")
          text = re.sub(r'database_id\s*=\s*"[^"]*"', f'database_id = "{d1_id}"', text)
          p.write_text(text, encoding="utf-8")
          PY
          echo "wrangler.toml now has:"
          grep -n "database_id" wrangler.toml || true
          if grep -Eq 'database_id\s*=\s*"(REPLACE_ME|)"' wrangler.toml; then
            echo "wrangler.toml still has placeholder database_id after patch" >&2
            exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "wrangler.toml before deploy:"
          grep -n "database_id" wrangler.toml || true
          if grep -Eq 'database_id\s*=\s*"(REPLACE_ME|)"' wrangler.toml; then
            echo "wrangler.toml has placeholder database_id before deploy" >&2
            exit 1
          fi
          set +e
          bun run deploy:worker 2>&1 | tee /tmp/deploy.log
          CODE=${PIPESTATUS[0]}
          set -e

          if [ $CODE -ne 0 ]; then
            echo "Deploy failed. Showing deploy output:"
            tail -n 4000 /tmp/deploy.log || true

            echo "Deploy failed. Showing latest Wrangler log:"
            LOG="$(ls -t ~/.config/.wrangler/logs/wrangler-*.log 2>/dev/null | head -n 1 || true)"
            if [ -n "${LOG:-}" ]; then
              echo "Wrangler log path: $LOG"
              sed -n '1,200p' "$LOG" || true
              tail -n 4000 "$LOG" || true
            else
              echo "No Wrangler log file found at ~/.config/.wrangler/logs/"
            fi
          fi

          exit $CODE
