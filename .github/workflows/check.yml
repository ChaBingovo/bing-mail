name: Check

# Pull requests get the same gate the deploy workflow applies, without any
# credentials: it must be impossible for a branch to merge with red checks.
on:
  pull_request:
    branches:
      - main
      - beta

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps (worker)
        run: bun install --cwd packages/worker --backend=copyfile

      - name: Install deps (web)
        run: bun install --cwd apps/web --backend=copyfile

      - name: Check (typecheck + test + build)
        run: bun run check
