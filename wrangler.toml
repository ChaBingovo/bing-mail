name = "bingmail"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-05-25"

[build]
command = "bun ./scripts/build-web.ts"

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[send_email]]
name = "EMAIL"

[vars]
HTML_INLINE_LIMIT = "102400"
PARSE_QUEUE_MAX_ATTEMPTS = "5"
WS_MAX_CONNECTIONS = "3"
LOGIN_FAIL_LIMIT = "5"
LOGIN_FAIL_WINDOW_MS = "600000"
# Days of mail (inbound raw + oversized HTML + sent history) kept before the cron
# sweep deletes it. 0 disables cleanup. The `retention_days` D1 setting overrides this.
MAIL_RETENTION_DAYS = "90"

[triggers]
# Daily retention sweep; see handleScheduled in packages/worker/src/handlers/maintenance.ts.
crons = ["17 3 * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "bingmail"
database_id = "REPLACE_ME"

[[r2_buckets]]
binding = "MAIL_BUCKET"
bucket_name = "bing-mail"

[[queues.producers]]
binding = "PARSE_QUEUE"
queue = "bingmail-parse"

[[queues.consumers]]
queue = "bingmail-parse"
max_batch_size = 1
max_batch_timeout = 1

[[durable_objects.bindings]]
name = "MAIL_EVENTS"
class_name = "MailEventsDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailEventsDO"]

[[durable_objects.bindings]]
name = "AUTH_RATE"
class_name = "AuthRateLimitDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthRateLimitDO"]
